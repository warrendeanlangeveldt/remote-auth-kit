# Optional hosted relay, only needed to use Login Relay from claude.ai or the
# Claude mobile app. Claude Code users don't need it.
# Request state is in memory, so run exactly ONE machine and keep it up
# (the extension holds a WebSocket open to it).
app = "login-relay-CHANGE-ME"
primary_region = "syd"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
